[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — todas as rotas vão pro index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache agressivo nos assets (eles tem hash no nome)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
