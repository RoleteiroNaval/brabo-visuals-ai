  document.getElementById('root').innerHTML = `<div style="padding:24px;font-family:monospace;color:#ff6b6b;background:#05070A;min-height:100vh"><h1 style="color:#39FF8B">⚠ Promise rejeitada</h1><pre style="white-space:pre-wrap;margin-top:12px">${e.reason?.message || e.reason}\n\n${e.reason?.stack || ''}</pre></div>`;
